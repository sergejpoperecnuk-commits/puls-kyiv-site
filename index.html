<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta name="theme-color" content="#09090b"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<title>Пульс Києва</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"/>
<style>
:root {
  --canvas:#09090b; --panel:#111214; --raised:#191b20; --ink:#ecece8;
  --quiet:#8c8e94; --dim:#6a6c72; --signal:#7dcfb6;
  --hair:rgb(236 236 232 / .08);
  --danger:#e07070; --warn:#d4b37a;
  font-family: Manrope, system-ui, sans-serif;
  color: var(--ink); background: var(--canvas);
}
* { box-sizing: border-box; }
html, body, #root { margin: 0; height: 100%; overscroll-behavior-y: none; }
.ptr {
  position: fixed; left: 0; right: 0; top: 0; z-index: 80;
  height: calc(56px + env(safe-area-inset-top));
  display: flex; align-items: flex-end; justify-content: center; gap: 8px;
  padding-bottom: 10px; pointer-events: none;
  transform: translateY(-100%);
  color: var(--quiet); font-size: 12px; font-weight: 500;
}
.ptr.dragging { transition: none; }
.ptr:not(.dragging) { transition: transform .25s ease; }
.ptr.busy { color: var(--signal); }
.ptr-spinner {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid rgb(236 236 232 / .16);
  border-top-color: var(--signal);
}
.ptr.busy .ptr-spinner, .ptr.armed .ptr-spinner { animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
button, input { font: inherit; }
a { color: inherit; }
button:not(:disabled) { cursor: pointer; }

.app { display: flex; height: 100dvh; background: var(--canvas); }
.side {
  width: 224px; flex-shrink: 0; display: flex; flex-direction: column;
  border-right: 1px solid var(--hair); background: var(--panel); padding: 22px 12px 16px;
}
.brand { display: flex; gap: 10px; align-items: center; padding: 0 8px 28px; }
.mark { width: 28px; height: 28px; border-radius: 8px; display: block; flex-shrink: 0; box-shadow: 0 0 0 1px rgb(125 207 182 / .35); }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav button {
  display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px;
  border: 0; border-radius: 10px; background: transparent; color: var(--quiet);
  overflow: hidden; white-space: nowrap;
}
.nav button svg { width: 16px; height: 16px; flex-shrink: 0; }
.nav button.on { background: var(--raised); color: var(--ink); }
.col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top {
  min-height: 56px; display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top));
  border-bottom: 1px solid var(--hair); background: var(--panel);
  position: sticky; top: 0; z-index: 60;
}
.top-brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex-shrink: 0; }
.top .mark { width: 32px; height: 32px; }
.top h2 { margin: 0; font-size: 15px; }
.search { margin-left: auto; width: min(320px, 48vw); }
.search input {
  width: 100%; background: var(--raised); border: 1px solid var(--hair);
  color: var(--ink); border-radius: 999px; padding: 10px 14px; outline: none;
}
.body { flex: 1; display: grid; grid-template-columns: 1fr 280px; min-height: 0; }
.main { overflow: auto; padding: 20px 16px 24px; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; }
.rail { border-left: 1px solid var(--hair); overflow: auto; padding: 22px 18px; background: var(--panel); }
.hero { background: var(--panel); border: 1px solid var(--hair); border-radius: 16px; padding: 16px; margin-bottom: 18px; }
.hero h3 { margin: 6px 0 0; font-size: 17px; }
.hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.live {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
  border: 1px solid var(--hair); background: var(--raised);
  border-radius: 999px; padding: 6px 10px; font-size: 12px; color: var(--quiet);
}
.live-dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--signal);
  box-shadow: 0 0 0 4px rgb(125 207 182 / .2);
}
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.stat { background: var(--raised); border-radius: 10px; padding: 10px 12px; margin: 0; }
.stat dt { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
.stat dd { margin: 6px 0 0; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.stat.quiet dd { color: var(--quiet); }
.toggle {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; border: 0; background: var(--raised); color: var(--ink);
  border-radius: 12px; padding: 14px 16px; text-align: left;
}
.switch { width: 40px; height: 24px; border-radius: 999px; background: #2a2c32; position: relative; flex-shrink: 0; }
.switch i { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #c7c8cc; transition: .2s; }
.toggle.on .switch { background: var(--signal); }
.toggle.on .switch i { left: 19px; background: #09110e; }
.siren {
  display: inline-flex; align-items: center; gap: 8px;
  margin-top: 12px; border-radius: 999px; padding: 8px 12px;
  font-size: 12px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase;
  border: 1px solid transparent;
}
.siren.red .pulse, .siren.yellow .pulse { animation: sirenblink 1.4s ease-in-out infinite; }
@keyframes sirenblink { 50% { opacity: .35; transform: scale(.85); } }
.siren.red { color: var(--danger); background: rgb(224 112 112 / .12); border-color: rgb(224 112 112 / .35); }
.siren.yellow { color: var(--warn); background: rgb(212 179 122 / .12); border-color: rgb(212 179 122 / .35); }
.siren.clear { color: var(--signal); background: rgb(125 207 182 / .1); border-color: rgb(125 207 182 / .28); }
.siren .where { text-transform: none; letter-spacing: 0; font-weight: 600; opacity: .95; }
.siren-detail { margin: 8px 2px 0; font-size: 12px; color: var(--quiet); }
.muted { color: var(--quiet); font-size: 13px; line-height: 1.5; }
.card { background: var(--panel); border: 1px solid var(--hair); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
.who { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.ava {
  width: 36px; height: 36px; border-radius: 12px; background: var(--raised);
  display: grid; place-items: center; font-size: 11px; color: var(--quiet); flex-shrink: 0;
}
.kicker { font-size: 11px; letter-spacing: .08em; color: var(--dim); text-transform: uppercase; }
.dock { display: none; }
.dock svg { width: 20px; height: 20px; }

@media (max-width: 960px) {
  .side, .rail { display: none !important; }
  .body { grid-template-columns: 1fr; }
  .search { width: min(52vw, 220px); }
  .main { padding-bottom: calc(92px + env(safe-area-inset-bottom)); }
  .stats { grid-template-columns: 1fr 1fr; }
  .dock {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 80;
    background: #111214;
    isolation: isolate;
    border-top: 1px solid var(--hair);
    box-shadow: 0 -18px 36px #09090b;
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  .dock button {
    min-height: 56px; border: 0; background: transparent; color: var(--dim);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; font-size: 10px; font-weight: 500; letter-spacing: .01em;
  }
  .dock button.on { color: var(--ink); }
  .dock button.on svg { color: var(--signal); }
}
</style>
</head>
<body>
<div id="ptr" class="ptr" aria-hidden="true"><div class="ptr-spinner"></div><span class="ptr-label">Потягніть</span></div>
<div id="root"></div>
<script type="module">
const SOURCES = [
  { id: "wm", title: "monitor", user: "war_monitor", cat: "Тривога", initials: "MO" },
  { id: "kn", title: "Київське небо", user: "kyiv_nebo", cat: "Тривога", initials: "КН" },
  { id: "pp", title: "ППО Київ", user: "ppo_kiev", cat: "Тривога", initials: "ПП" },
  { id: "pt", title: "Повітряна тривога Київ", user: "airAlarm_Kyiv", cat: "Тривога", initials: "ПТ" },
  { id: "ki", title: "Київ ІНФО", user: "kievinform_ua1", cat: "Тривога", initials: "КІ" },
  { id: "mw", title: "monitorwar", user: "monitoringwar", cat: "Тривога", initials: "MW" },
  { id: "ka", title: "Київ Моніторинг", user: "KyivAlarm", cat: "Тривога", initials: "КА" },
  { id: "va", title: "КМВА", user: "VA_Kyiv", cat: "Офіційне", initials: "ВА" },
  { id: "od", title: "Київська ОВА", user: "kyivoda", cat: "Офіційне", initials: "ОД" },
];
const CATS = ["Усі", "Тривога", "Офіційне"];
const TABS = [
  { id: "home", label: "Головна", title: "Наживо", icon: "home" },
  { id: "feed", label: "Стрічка", title: "Стрічка", icon: "feed" },
  { id: "sources", label: "Джерела", title: "Джерела", icon: "src" },
  { id: "search", label: "Пошук", title: "Пошук", icon: "search" },
  { id: "settings", label: "Налаштування", title: "Налаштування", icon: "gear" },
];
function icon(name) {
  const p = 'width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
  if (name === "home") return '<svg viewBox="0 0 24 24" '+p+'><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>';
  if (name === "feed") return '<svg viewBox="0 0 24 24" '+p+'><circle cx="12" cy="12" r="2"/><path d="M5 12a7 7 0 0 1 7-7"/><path d="M19 12a7 7 0 0 0-7-7"/><path d="M2 12a10 10 0 0 1 10-10"/><path d="M22 12a10 10 0 0 0-10-10"/></svg>';
  if (name === "src") return '<svg viewBox="0 0 24 24" '+p+'><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>';
  if (name === "search") return '<svg viewBox="0 0 24 24" '+p+'><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
  return '<svg viewBox="0 0 24 24" '+p+'><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>';
}
function ago(ts) {
  const min = Math.max(0, Math.round((Date.now() - ts) / 60000));
  if (min < 1) return "щойно";
  if (min < 60) return min + " хв";
  return Math.floor(min / 60) + " год";
}
let tab = "home", q = "", cat = "Усі", messages = [];
let alertStatus = { level: "clear", title: "Немає тривоги", where: "Київ", detail: "перевіряємо…" };
let feedStats = { today: 0, last24h: 0, sourceCount: 9, scraperOk: false };
function pulseMark() {
  return '<svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#191b20"/><path d="M3.5 17.5H9.1L12.15 7.4 16.7 25.6 20.1 17.5H28.5" fill="none" stroke="#7dcfb6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function liveBadge() {
  return '<div class="live"><span class="live-dot"></span> Наживо</div>';
}
function statsGrid() {
  const s = feedStats;
  function box(label, value, quiet) {
    return '<div class="stat' + (quiet ? " quiet" : "") + '"><dt>' + label + "</dt><dd>" + value + "</dd></div>";
  }
  return '<dl class="stats">' +
    box("Сьогодні", s.today || messages.length) +
    box("За добу", s.last24h || messages.length) +
    box("Джерела", s.sourceCount || SOURCES.length) +
    box("Telegram", s.scraperOk ? "мережа" : (messages.length ? "мережа" : "резерв"), !s.scraperOk && !messages.length) +
    "</dl>";
}
function heroBlock() {
  const latest = messages[0];
  const lastLine = latest ? ("Останнє · " + ago(latest.t) + " · " + latest.s.title) : "Відкриті Telegram-канали зі списку джерел";
  return '<div class="hero"><div class="hero-top"><div><div class="kicker">Огляд</div><h3>Наживо по Києву</h3><p class="muted" style="margin:6px 0 0">' + lastLine + "</p></div>" + liveBadge() + "</div>" + sirenBlock() + statsGrid() + "</div>";
}
function pushOn() {
  return localStorage.getItem("pulse-push") === "1" && typeof Notification !== "undefined" && Notification.permission === "granted";
}
function pushStatusText() {
  if (typeof Notification === "undefined") return "Цей браузер не вміє пуш.";
  if (Notification.permission === "denied") return "Браузер заборонив сповіщення. Дозвольте їх у налаштуваннях сайту.";
  if (pushOn()) return "Увімкнено: тривога і нові пости.";
  return "Вимкнено.";
}
let seenIds = new Set();
let lastAlertLevel = "";
let bootDone = false;
function notifyUser(title, body, tag) {
  if (!pushOn()) return;
  const opts = { body: body || "", tag: tag || "pulse", lang: "uk", icon: "/icon-192.png", badge: "/icon-192.png", vibrate: [140, 70, 140] };
  if (navigator.serviceWorker) {
    navigator.serviceWorker.ready.then(function (reg) { reg.showNotification(title, opts); }).catch(function () { try { new Notification(title, opts); } catch (e) {} });
  } else {
    try { new Notification(title, opts); } catch (e) {}
  }
}
async function setPush(on) {
  if (!on) {
    localStorage.setItem("pulse-push", "0");
    render();
    return;
  }
  if (typeof Notification === "undefined") return;
  const perm = await Notification.requestPermission();
  if (perm === "granted") {
    localStorage.setItem("pulse-push", "1");
    try { await navigator.serviceWorker.register("/sw.js"); } catch (e) {}
    notifyUser("Пульс Києва", "Сповіщення увімкнено", "pulse-on");
  } else {
    localStorage.setItem("pulse-push", "0");
  }
  render();
}
function sirenBlock() {
  const a = alertStatus || {};
  const level = a.level === "red" || a.level === "yellow" ? a.level : "clear";
  return '<div class="siren ' + level + '"><span class="pulse"></span><span>' + (a.title || "Статус") + '</span><span class="where">· ' + (a.where || "Київ") + '</span></div><p class="siren-detail">' + (a.detail || "") + "</p>";
}
function card(m) {
  return '<article class="card"><div class="who"><div class="ava">' + m.s.initials + '</div><div><b>' + m.s.title + '</b><br><small class="muted">' + ago(m.t) + ' · ' + m.s.cat + '</small></div></div><p>' + m.text + '</p><p class="muted"><a href="' + (m.url || ("https://t.me/" + m.s.user)) + '" target="_blank" rel="noreferrer">Відкрити в Telegram</a></p></article>';
}
function filtered() {
  const query = q.trim().toLowerCase();
  return messages.filter(function (m) {
    if (cat !== "Усі" && m.s.cat !== cat) return false;
    if (!query) return true;
    return (m.text + " " + m.s.title + " " + m.s.user).toLowerCase().includes(query);
  });
}
function render() {
  const titles = TABS.find(function (t) { return t.id === tab; });
  const list = filtered();
  const prevMain = document.querySelector(".main");
  savedScroll = prevMain ? prevMain.scrollTop : savedScroll;
  let main = "";
  if (tab === "home") {
    main = heroBlock() + (pushOn() ? "" : '<button class="toggle" id="push-home" style="margin-bottom:14px"><span>Увімкнути пуш про тривогу</span><span class="switch"><i></i></span></button>') + list.slice(0, 8).map(card).join("");
  } else if (tab === "feed") {
    main = list.map(card).join("") || '<p class="muted">Чекаємо пости…</p>';
  } else if (tab === "sources") {
    main = SOURCES.map(function (s) {
      return '<div class="card"><div class="who"><div class="ava">' + s.initials + '</div><div><b>' + s.title + '</b><br><small class="muted">@' + s.user + "</small></div></div></div>";
    }).join("");
  } else if (tab === "search") {
    main = list.length ? list.map(card).join("") : '<p class="muted">Нічого не знайдено.</p>';
  } else {
    main = '<div class="card"><p style="margin:0 0 8px"><b>Сповіщення</b></p><p class="muted">Пуш про тривогу і нові повідомлення. На iPhone — після «На екран «Домашній»».</p></div>' +
      '<button class="toggle' + (pushOn() ? " on" : "") + '" id="push-toggle"><span>Пуш-повідомлення</span><span class="switch"><i></i></span></button>' +
      '<p class="muted" id="push-status" style="margin:10px 2px 0">' + pushStatusText() + "</p>" +
      '<div class="card" style="margin-top:16px"><p class="muted" style="margin:0">Оновлення з публічних Telegram-каналів кожні 25 с. Свайп зверху вниз — оновити зараз.</p></div>';
  }
  const sideNav = TABS.map(function (item) {
    return '<button class="' + (tab === item.id ? "on" : "") + '" data-tab="' + item.id + '">' + icon(item.icon) + " " + item.label + "</button>";
  }).join("");
  const dock = TABS.map(function (item) {
    return '<button class="' + (tab === item.id ? "on" : "") + '" data-tab="' + item.id + '">' + icon(item.icon) + "<span>" + item.label + "</span></button>";
  }).join("");
  document.getElementById("root").innerHTML =
    '<div class="app"><aside class="side"><div class="brand">' + pulseMark() + '<div><b>Пульс Києва</b><br><small class="muted">Цивільний моніторинг</small></div></div><nav class="nav">' + sideNav + '</nav></aside><div class="col"><header class="top"><div class="top-brand">' + pulseMark() + '<div><h2>Пульс</h2><p class="muted" style="margin:2px 0 0">' + titles.title + ' · ' + messages.length + ' повідомлень</p></div></div><div class="search"><input id="q" placeholder="Пошук у стрічці"/></div></header><div class="body"><section class="main">' + main + '</section><aside class="rail"><div class="kicker">Сьогодні</div><p style="font-size:36px;margin:4px 0">' + messages.length + "</p>" + CATS.map(function (c) { return '<button data-cat="' + c + '" class="' + (c === cat ? "on" : "") + '" style="margin:4px 4px 0 0;border:0;border-radius:999px;padding:6px 10px;background:' + (c === cat ? "var(--ink)" : "var(--raised)") + ';color:' + (c === cat ? "var(--canvas)" : "var(--quiet)") + '">' + c + "</button>"; }).join("") + SOURCES.map(function (s) { return '<p>' + s.title + '<br><small class="muted">@' + s.user + "</small></p>"; }).join("") + '</aside></div></div></div><nav class="dock" aria-label="Розділи">' + dock + "</nav>";
  document.querySelectorAll("[data-tab]").forEach(function (b) {
    b.onclick = function () { tab = b.getAttribute("data-tab"); render(); };
  });
  document.querySelectorAll("[data-cat]").forEach(function (b) {
    b.onclick = function () { cat = b.getAttribute("data-cat"); render(); };
  });
  var inp = document.getElementById("q");
  if (inp) {
    inp.value = q;
    inp.oninput = function (e) { q = e.target.value; if (q) tab = "search"; render(); };
  }
  const newMain = document.querySelector(".main");
  if (newMain) {
    newMain.scrollTop = savedScroll;
    bindPtr(newMain);
  }
  const pushBtn = document.getElementById("push-toggle");
  if (pushBtn) {
    pushBtn.onclick = function () { setPush(!pushOn()); };
  }
  const pushHome = document.getElementById("push-home");
  if (pushHome) {
    pushHome.onclick = function () { setPush(true); };
  }
}
let savedScroll = 0;
const ptr = { y0: 0, pulling: false, armed: false, busy: false, dist: 0 };
function ptrEl() { return document.getElementById("ptr"); }
function showPtr(dist, state) {
  const el = ptrEl();
  if (!el) return;
  const d = Math.max(0, Math.min(96, dist));
  el.classList.toggle("dragging", state === "pull" || state === "armed");
  el.classList.toggle("armed", state === "armed");
  el.classList.toggle("busy", state === "busy");
  el.style.transform = d > 0 || state === "busy" ? "translateY(" + Math.min(d, 72) + "px)" : "translateY(-100%)";
  const label = el.querySelector(".ptr-label");
  if (label) {
    label.textContent = state === "busy" ? "Оновлюємо…" : state === "armed" ? "Відпустіть" : "Потягніть";
  }
}
function bindPtr(main) {
  main.addEventListener("touchstart", function (e) {
    if (ptr.busy || !e.touches || !e.touches[0]) return;
    if (main.scrollTop > 4) { ptr.pulling = false; return; }
    ptr.y0 = e.touches[0].clientY;
    ptr.pulling = true;
    ptr.armed = false;
    ptr.dist = 0;
  }, { passive: true });
  main.addEventListener("touchmove", function (e) {
    if (!ptr.pulling || ptr.busy) return;
    if (main.scrollTop > 4) { ptr.pulling = false; showPtr(0, ""); return; }
    const y = e.touches[0].clientY;
    const dy = y - ptr.y0;
    if (dy < 8) return;
    e.preventDefault();
    ptr.dist = Math.min(96, dy * 0.55);
    ptr.armed = ptr.dist > 56;
    showPtr(ptr.dist, ptr.armed ? "armed" : "pull");
  }, { passive: false });
  main.addEventListener("touchend", function () {
    if (!ptr.pulling || ptr.busy) return;
    ptr.pulling = false;
    if (ptr.armed) refresh();
    else showPtr(0, "");
  });
}
async function refresh() {
  if (ptr.busy) return;
  ptr.busy = true;
  ptr.armed = false;
  showPtr(64, "busy");
  await loadFeed();
  ptr.busy = false;
  showPtr(0, "");
}
async function loadFeed() {
  try {
    const data = await (await fetch("/api/feed", { cache: "no-store" })).json();
    if (data.ok) {
      if (data.messages && data.messages.length) messages = data.messages;
      if (data.alert) alertStatus = data.alert;
      if (data.stats) feedStats = data.stats;
      if (bootDone) {
        if (alertStatus.level !== lastAlertLevel && (alertStatus.level === "red" || alertStatus.level === "yellow")) {
          notifyUser(alertStatus.title + " · " + alertStatus.where, alertStatus.detail, "pulse-alert");
        }
        const fresh = messages.filter(function (m) { return !seenIds.has(m.id); });
        if (fresh.length) {
          notifyUser(fresh[0].s.title, String(fresh[0].text || "").slice(0, 140), "pulse-msg");
        }
      }
      bootDone = true;
      lastAlertLevel = alertStatus.level || "";
      seenIds = new Set(messages.map(function (m) { return m.id; }));
      render();
    }
  } catch (e) {}
}
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(function () {});
}
setInterval(loadFeed, 25000);
render();
loadFeed();
</script>
</body>
