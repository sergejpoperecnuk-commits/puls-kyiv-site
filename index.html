<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#09090b"/>
<title>Пульс Києва</title>
<style>
:root {
  --canvas: #09090b;
  --panel: #111214;
  --raised: #191b20;
  --ink: #ecece8;
  --quiet: #8c8e94;
  --dim: #6a6c72;
  --signal: #7dcfb6;
  --hair: rgb(236 236 232 / 0.08);
  --warn: #d4b37a;
  font-family: Manrope, system-ui, sans-serif;
  color: var(--ink);
  background: var(--canvas);
}
* { box-sizing: border-box; }
html, body, #root { margin: 0; height: 100%; }
button, input { font: inherit; }
a { color: inherit; }

.app { display: flex; height: 100dvh; background: var(--canvas); }
.side {
  width: 224px; flex-shrink: 0; display: flex; flex-direction: column;
  border-right: 1px solid var(--hair); background: var(--panel); padding: 22px 12px 16px;
}
.brand { display: flex; gap: 10px; align-items: center; padding: 0 8px 28px; }
.mark {
  width: 28px; height: 28px; border-radius: 8px; position: relative;
  box-shadow: 0 0 0 1px rgb(125 207 182 / 0.35);
}
.mark::after {
  content: ""; position: absolute; inset: 8px; border-radius: 50%;
  background: var(--signal); box-shadow: 0 0 0 4px rgb(125 207 182 / 0.2);
}
.brand b { display: block; font-size: 14px; }
.brand small { color: var(--dim); font-size: 11px; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav button {
  display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px;
  border: 0; border-radius: 10px; background: transparent; color: var(--quiet);
  cursor: pointer; font-size: 14px; font-weight: 500;
}
.nav button:hover { background: rgb(25 27 32 / 0.7); color: var(--ink); }
.nav button.on { background: var(--raised); color: var(--ink); box-shadow: 0 0 0 1px var(--hair); }
.side-foot { margin-top: auto; padding: 8px; }
.live {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--quiet);
  border: 1px solid var(--hair); border-radius: 999px; padding: 4px 8px;
}
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--signal); animation: blink 1.8s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.4; transform: scale(0.85); } }
.col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top {
  min-height: 64px; display: flex; align-items: center; gap: 16px;
  padding: 0 24px; border-bottom: 1px solid var(--hair); background: rgb(17 18 20 / 0.92);
}
.top h2 { margin: 0; font-size: 15px; font-weight: 600; }
.top p { margin: 2px 0 0; color: var(--dim); font-size: 12px; }
.search { margin-left: auto; width: min(320px, 42vw); }
.search input {
  width: 100%; background: var(--raised); border: 1px solid var(--hair);
  color: var(--ink); border-radius: 999px; padding: 10px 14px; outline: none;
}
.body { flex: 1; display: grid; grid-template-columns: 1fr 280px; min-height: 0; }
.main { overflow: auto; padding: 22px 24px 48px; }
.rail { border-left: 1px solid var(--hair); overflow: auto; padding: 22px 18px; background: var(--panel); }
.hero { background: var(--panel); border: 1px solid var(--hair); border-radius: 16px; padding: 18px; margin-bottom: 22px; }
.hero-top { display: flex; justify-content: space-between; align-items: start; }
.kicker { font-size: 11px; letter-spacing: 0.08em; color: var(--dim); text-transform: uppercase; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.stat { background: var(--raised); border-radius: 12px; padding: 12px; }
.stat span { display: block; font-size: 11px; color: var(--dim); }
.stat b { font-size: 22px; font-weight: 600; }
.day { font-size: 11px; color: var(--dim); letter-spacing: 0.08em; margin: 8px 0 12px; }
.card { background: var(--panel); border: 1px solid var(--hair); border-radius: 16px; padding: 16px 18px; margin-bottom: 12px; }
.card.fresh { animation: in 0.4s ease both; }
@keyframes in { from { opacity: 0; transform: translateY(-8px); } }
.who { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.ava {
  width: 36px; height: 36px; border-radius: 12px; background: var(--raised);
  display: grid; place-items: center; font-size: 11px; font-weight: 600; color: var(--quiet); flex-shrink: 0;
}
.who b { font-size: 14px; }
.who small { color: var(--dim); font-size: 12px; }
.tag {
  font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--warn); border: 1px solid rgb(212 179 122 / 0.25); border-radius: 999px; padding: 2px 7px; margin-left: 6px;
}
.tag.signal { color: var(--signal); border-color: rgb(125 207 182 / 0.25); }
.card p { margin: 0 0 12px; line-height: 1.5; font-size: 14.5px; }
.card footer { display: flex; justify-content: space-between; color: var(--quiet); font-size: 13px; }
.big { font-size: 42px; font-weight: 600; letter-spacing: -1px; margin: 4px 0; }
.muted { color: var(--quiet); font-size: 13px; line-height: 1.55; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 18px; }
.chips button {
  border: 0; cursor: pointer; font-size: 12px; padding: 6px 10px; border-radius: 999px;
  background: var(--raised); color: var(--quiet);
}
.chips button.on { background: var(--ink); color: var(--canvas); }
.src { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.src .nm { flex: 1; font-size: 13px; }
.src small { color: var(--dim); display: block; font-size: 11px; }
@media (max-width: 960px) {
  .side, .rail { display: none; }
  .body { grid-template-columns: 1fr; }
  .stats { grid-template-columns: 1fr 1fr; }
}

.nav button svg { width:16px; height:16px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
const SOURCES = [
  { id: "wm", title: "monitor", user: "war_monitor", cat: "Тривога", initials: "MO" },
  { id: "kn", title: "Київське небо", user: "kyiv_nebo", cat: "Тривога", initials: "КН" },
  { id: "pp", title: "ППО Київ", user: "ppo_kiev", cat: "Тривога", initials: "ПП" },
  { id: "pt", title: "Повітряна тривога Київ", user: "airAlarm_Kyiv", cat: "Тривога", initials: "ПТ" },
  { id: "ki", title: "Київ ІНФО", user: "kievinform_ua1", cat: "Тривога", initials: "КІ" },
  { id: "mw", title: "monitorwar", user: "monitoringwar", cat: "Тривога", initials: "MW" },
  { id: "ka", title: "Київ Моніторинг", user: "KyivAlarm", cat: "Тривога", initials: "КА" },
  { id: "va", title: "КМВА", user: "VA_Kyiv", cat: "Офіційне", initials: "ВА" },
  { id: "od", title: "Київська ОВА", user: "kyivoda", cat: "Офіційне", initials: "ОД" },
];
const SEED = [
  ["kn", "Наразі без фіксації пусків. Стежте за офіційними сигналами тривоги. Інформація з відкритих джерел і не є офіційною.", 4],
  ["wm", "Моніторинг повітряної обстановки. Залишайтеся біля укриття, доки немає офіційного відбою. Не поширюйте неперевірені повідомлення.", 9],
  ["kn", "Очікуємо на відбій. Канал збирає відкриті джерела і не замінює ДСНС чи «Київ Цифровий».", 22],
  ["wm", "Оновлення моніторингу: слідкуйте за офіційними каналами цивільного захисту. Застосунок не рахує координати й не прогнозує цілі.", 41],
  ["pp", "Сповіщення про загрозу в Києві та області. Перевіряйте офіційний сигнал.", 78],
  ["va", "Офіційні повідомлення Київської міської військової адміністрації — @VA_Kyiv.", 125],
  ["od", "Офіційний канал Київської обласної військової адміністрації — @kyivoda.", 190],
  ["pt", "Інформація з відкритих джерел про повітряну тривогу в Києві.", 260],
];
const LIVE = [];
const CATS = ["Усі", "Тривога", "Офіційне"];
const TABS = [
  { id: "home", label: "Головна", title: "Наживо" },
  { id: "feed", label: "Стрічка", title: "Стрічка" },
  { id: "sources", label: "Джерела", title: "Джерела" },
  { id: "search", label: "Пошук", title: "Пошук" },
  { id: "settings", label: "Налаштування", title: "Налаштування" },
];
function ago(ts) {
  const min = Math.max(0, Math.round((Date.now() - ts) / 60000));
  if (min < 1) return "щойно";
  if (min < 60) return min + " хв";
  return Math.floor(min / 60) + " год";
}
const src = (id) => SOURCES.find((s) => s.id === id);
let tab = "home";
let q = "";
let cat = "Усі";
let messages = SEED.map(([id, text, min]) => ({
  id: id + "-" + min, s: src(id), text, t: Date.now() - min * 60000, fresh: false,
}));
function card(m) {
  const tagClass = m.s.cat === "Тривога" ? "tag signal" : "tag";
  return `<article class="${m.fresh ? "card fresh" : "card"}">
    <div class="who"><div class="ava">${m.s.initials}</div>
    <div><b>${m.s.title}</b><span class="${tagClass}">${m.s.cat}</span><br>
    <small>${ago(m.t)} · сьогодні</small></div></div>
    <p>${m.text}</p>
    <footer><a href="${m.url || ("https://t.me/" + m.s.user)}" target="_blank" rel="noreferrer">Відкрити в Telegram ↗</a>
    <span>@${m.s.user}</span></footer></article>`;
}
function filtered() {
  const query = q.trim().toLowerCase();
  return messages.filter((m) => {
    if (cat !== "Усі" && m.s.cat !== cat) return false;
    if (!query) return true;
    return (m.text + " " + m.s.title + " " + m.s.user).toLowerCase().includes(query);
  });
}
function render() {
  const titles = TABS.find((t) => t.id === tab);
  const list = filtered();
  let main = "";
  if (tab === "home") {
    main = `<div class="hero"><div class="hero-top"><div>
      <div class="kicker">Огляд</div><h3 style="margin:6px 0 0">Наживо по Києву</h3>
      <p class="muted">Останнє · Telegram · дозволені канали</p></div>
      <div class="live"><span class="dot"></span> Наживо</div></div>
      <div class="stats">
        <div class="stat"><span>СЬОГОДНІ</span><b>${messages.length}</b></div>
        <div class="stat"><span>ЗА ДОБУ</span><b>${messages.length}</b></div>
        <div class="stat"><span>ДЖЕРЕЛА</span><b>${SOURCES.length}</b></div>
        <div class="stat"><span>TELEGRAM</span><b>мережа</b></div>
      </div></div>
      <div class="day">СЬОГОДНІ</div>${list.slice(0,8).map(card).join("")}`;
  } else if (tab === "feed") {
    main = `<div class="day">СТРІЧКА</div>${list.map(card).join("")}`;
  } else if (tab === "sources") {
    main = `<h3 style="margin-top:0">Джерела</h3><p class="muted">Allowlist цивільних каналів.</p>` +
      SOURCES.map((s) => `<div class="card"><div class="who"><div class="ava">${s.initials}</div>
      <div><b>${s.title}</b><span class="tag">${s.cat}</span><br><small>@${s.user}</small></div></div>
      <footer><a href="https://t.me/${s.user}" target="_blank" rel="noreferrer">Відкрити в Telegram ↗</a></footer></div>`).join("");
  } else if (tab === "search") {
    main = `<h3 style="margin-top:0">Пошук</h3>` + (list.length ? list.map(card).join("") : `<p class="muted">Нічого не знайдено.</p>`);
  } else {
    main = `<h3 style="margin-top:0">Налаштування</h3>
      <p class="muted">Пульс Києва: вкладки, пошук, фільтри, автооновлення. Джерела — лише дозволені Telegram-канали Києва.</p>`;
  }
  document.getElementById("root").innerHTML = `
  <div class="app">
    <aside class="side">
      <div class="brand"><div class="mark"></div><div><b>Пульс Києва</b><small>Цивільний моніторинг</small></div></div>
      <nav class="nav">${TABS.map((item) => `<button class="${tab===item.id?"on":""}" data-tab="${item.id}">${item.label}</button>`).join("")}</nav>
      <div class="side-foot"><div class="live"><span class="dot"></span> Наживо</div>
      <p class="muted" style="margin:10px 4px 0">Дозволені джерела Києва та області. Без координат і військових цілей.</p></div>
    </aside>
    <div class="col">
      <header class="top"><div><h2>${titles.title}</h2><p>Останнє · щойно · ${SOURCES.length} джерел</p></div>
      <div class="search"><input id="q" placeholder="Пошук у стрічці" value="${q.replace(/"/g,'"')}"/></div></header>
      <div class="body">
        <section class="main">${main}</section>
        <aside class="rail">
          <div class="kicker">Сьогодні</div><p class="big">${messages.length}</p>
          <p class="muted">цивільних повідомлень · ${messages.length} за добу</p>
          <div class="kicker" style="margin-top:22px">Тема</div>
          <div class="chips">${CATS.map((c)=>`<button class="${c===cat?"on":""}" data-cat="${c}">${c}</button>`).join("")}</div>
          <div class="kicker">Джерела</div>
          ${SOURCES.map((s)=>`<div class="src"><div class="ava">${s.initials}</div><div class="nm">${s.title}<small>${s.user}</small></div><span class="dot"></span></div>`).join("")}
        </aside>
      </div>
    </div>
  </div>`;
  document.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { tab = b.dataset.tab; render(); });
  document.querySelectorAll("[data-cat]").forEach((b) => b.onclick = () => { cat = b.dataset.cat; render(); });
  const inp = document.getElementById("q");
  inp?.addEventListener("input", (e) => { q = e.target.value; if (q) tab = "search"; render(); inp.focus(); const el=document.getElementById("q"); if(el){ el.value=q; el.setSelectionRange(q.length,q.length);} });
}
setInterval(loadFeed, 25000);
async function loadFeed() {
  try {
    const res = await fetch("/api/feed");
    const data = await res.json();
    if (!data.ok || !Array.isArray(data.messages) || !data.messages.length) return;
    const known = new Set(messages.map((m) => m.id));
    const incoming = data.messages.map((m) => ({
      ...m,
      s: m.s,
      fresh: !known.has(m.id),
    }));
    messages = incoming;
    render();
  } catch (e) {
    /* keep last */
  }
}
render();
loadFeed();
</script>
</body></html>
