function normalizeUser(raw) {

  const extras = readExtras();
  if (extras.length >= 15) {
    extraError = "Можна додати ще до 15 каналів";
    render();
    return;
  }
  extraBusy = true;
  extraError = "";
  render();
  extras.push({ user: user, title: user });
  saveExtras(extras);
  extraDraft = "";
  extraBusy = false;
  tab = "sources";
  render();
  await loadFeed();
}
function removeExtraSource(user) {
  saveExtras(readExtras().filter(function (s) { return s.user.toLowerCase() !== String(user || "").toLowerCase(); }));
  extraError = "";
  render();
  loadFeed();
}
async function loadFeed() {
  try {
    const extras = readExtras().map(function (s) { return s.user; }).join(",");
    const url = extras ? "/api/feed?extra=" + encodeURIComponent(extras) : "/api/feed";
    const data = await (await fetch(url, { cache: "no-store" })).json();
    if (data.ok) {
      if (data.messages && data.messages.length) messages = data.messages;
      if (data.alert) serverAlert = data.alert;
      if (data.zones) zones = data.zones;
      alertStatus = applyLocalAlert(serverAlert, zones);
      if (data.stats) feedStats = data.stats;
      const stored = readExtras();
      let changed = false;
      stored.forEach(function (item) {
        const hit = (data.messages || []).find(function (m) {
          return m.s && m.s.user && m.s.user.toLowerCase() === item.user.toLowerCase();
        });
        if (hit && hit.s.title && hit.s.title !== item.title) {
          item.title = hit.s.title;
          changed = true;
        }
      });
      if (changed) saveExtras(stored);
      if (bootDone) {
        const urgentKind = alertStatus.kind === "ballistic" || alertStatus.kind === "mig31";
        const sirenOn = alertStatus.level === "red" && (alertStatus.siren || urgentKind);
        const sirenKey = sirenOn ? (alertStatus.kind || "air") + ":" + (alertStatus.where || "") + ":" + (alertStatus.since || 0) : "off";
        if (sirenOn && lastAlertLevel !== sirenKey) {
          if (soundOn() || urgentKind) playOfficialSiren();
          notifyUser(alertStatus.title + " · " + alertStatus.where, shelterLine(alertStatus.kind), "pulse-alert");
        } else if (!sirenOn && Date.now() >= testBoostUntil) {
          stopSiren();
        }
      }
      bootDone = true;
      lastAlertLevel = alertStatus.level === "red" && (alertStatus.siren || alertStatus.kind === "ballistic" || alertStatus.kind === "mig31")
        ? (alertStatus.kind || "air") + ":" + (alertStatus.where || "") + ":" + (alertStatus.since || 0)
        : "off";
      seenIds = new Set(messages.map(function (m) { return m.id; }));
      render();
    }
  } catch (e) {}
}
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(function () {});
}
setInterval(loadFeed, 15000);
document.addEventListener("pointerdown", unlockAudio, { once: true });
document.addEventListener("touchstart", unlockAudio, { once: true });
window.addEventListener("resize", pinDock);
if (window.visualViewport) window.visualViewport.addEventListener("resize", pinDock);
render();
loadFeed();
</script>
